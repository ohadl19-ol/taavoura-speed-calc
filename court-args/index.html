<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>טיעונים לאולם</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f3a5f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="טיעונים">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* כלי עבודה לאולם: בחירת טיעון, בורר נסיבות, טקסט קריא גדול */
  --bg:#f3f4f7;
  --surface:#ffffff;
  --ink:#16202e;
  --muted:#5b6678;
  --line:#d8dce4;
  --accent:#1f3a5f;
  --accent-soft:#e3eaf3;
  --mark:#fff4d6;
  --mark-edge:#d9a520;
  --font-display:"Frank Ruhl Libre", "Times New Roman", serif;
  --font-body:"Heebo", "Arial Hebrew", Arial, sans-serif;
  --read-size:20px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10151d; --surface:#18202b; --ink:#e8ecf2; --muted:#9aa5b5; --line:#2b3544;
    --accent:#8fb3e0; --accent-soft:#1f2c3d; --mark:#2e2814; --mark-edge:#c9971c;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10151d; --surface:#18202b; --ink:#e8ecf2; --muted:#9aa5b5; --line:#2b3544;
  --accent:#8fb3e0; --accent-soft:#1f2c3d; --mark:#2e2814; --mark-edge:#c9971c;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 48px;display:flex;flex-direction:column;gap:16px}
header h1{font-family:var(--font-display);font-size:26px;margin:4px 0 2px;text-wrap:balance}
header p{margin:0;color:var(--muted);font-size:14px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{font:inherit;font-size:16px;font-weight:700;padding:10px 16px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;min-height:46px}
@media (max-width:520px){.tab{font-size:14px;padding:8px 11px;min-height:40px}.tabs{gap:6px}}
.tab[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.panel h2{font-size:13px;font-weight:700;color:var(--muted);margin:0 0 8px;letter-spacing:.02em}
.group{display:flex;flex-direction:column;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:15px;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;min-height:42px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--surface);border-color:var(--accent)}
.chip:focus-visible,.tool:focus-visible,.tab:focus-visible{outline:3px solid var(--mark-edge);outline-offset:2px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tool{font:inherit;font-size:14px;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--accent-soft);color:var(--ink);cursor:pointer;min-height:40px}
.tool.primary{background:var(--accent);color:var(--surface);border-color:var(--accent);font-weight:700}
.status{font-size:13px;color:var(--muted)}
#speech{font-size:var(--read-size);line-height:1.75}
#speech p{margin:0 0 .8em;max-width:65ch}
#speech p:last-child{margin-bottom:0}
#speech strong{color:var(--accent)}
#speech .opt{background:var(--mark);border-inline-start:4px solid var(--mark-edge);padding:4px 10px;border-radius:4px}
.cases{display:flex;flex-direction:column;gap:8px;font-size:15px}
.case{display:grid;gap:2px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.case:last-child{border-bottom:0;padding-bottom:0}
.case span{color:var(--muted)}
.case a{color:var(--accent);font-weight:700}
.legend{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:14px;height:14px;background:var(--mark);border-inline-start:4px solid var(--mark-edge)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>טיעונים לאולם</h1>
    <p id="subtitle"></p>
  </header>

  <nav class="tabs" role="tablist" id="tabs" aria-label="בחירת טיעון"></nav>

  <section class="panel group" id="controls" aria-label="נסיבות"></section>

  <section class="panel" aria-label="הטיעון">
    <div class="toolbar">
      <button class="tool primary" type="button" id="copy">העתק טיעון</button>
      <button class="tool" type="button" id="paraBtn" hidden>פסקה לטיעון לעונש</button>
      <button class="tool" type="button" id="smaller" aria-label="הקטן טקסט">א−</button>
      <button class="tool" type="button" id="bigger" aria-label="הגדל טקסט">א+</button>
      <span class="legend"><i></i>תוספת לפי הנסיבות</span>
      <span class="status" id="status" aria-live="polite"></span>
    </div>
    <div id="speech"></div>
  </section>

  <section class="panel" aria-label="פסיקה">
    <h2>פסיקה לאסמכתה</h2>
    <div class="cases" id="cases"></div>
  </section>
</div>

<script>
(function(){
  var N = "https://www.nevo.co.il/search/Highlighter2.aspx?verdictid=";

  /* ===== מודולי טיעון: להוספת טיעון חדש מוסיפים אובייקט למערך ===== */
  var MODULES = [
  {
    id:"absentia",
    tab:"שפיטה בהעדר",
    subtitle:"מענה לטענה \"אין ראיה שהסנגור עדכן את הנאשם\". סעיפים 237(ב) ו-240 לחסד\"פ.",
    groups:[
      {title:"איך נמסר המועד לסנגור", radio:"delivery", options:[
        {val:"sign", label:"חתם על זימון בפני התובע"},
        {val:"protocol", label:"החלטה בנוכחותו"},
        {val:"net", label:"נט המשפט"},
        {val:"mail", label:"דואר רשום למשרדו"}]},
      {title:"נסיבות נוספות", toggles:[
        {key:"defense", label:"הדחייה לבקשת ההגנה"},
        {key:"fine", label:"עבירת קנס"},
        {key:"last", label:"כבר ניתנה הזדמנות אחרונה"}]},
      {title:"מה השופט טוען", toggles:[
        {key:"panel", label:"התיק עבר שופט"},
        {key:"claim", label:"אולי יש לנאשם הגנה"},
        {key:"reject", label:"מתכוון לדחות שוב"}]}
    ],
    defaults:{delivery:"sign", defense:true, fine:true, last:false, panel:false, claim:false, reject:false},
    build:function(s){
      var d = {
        sign:"הסנגור חתם על הזימון כאן, בפני התובע, ובזימון כתוב במפורש שאם הנאשם לא יתייצב הוא יישפט בהעדרו",
        protocol:"המועד נקבע בהחלטה שניתנה כשהסנגור עמד כאן באולם",
        net:"ההחלטה על המועד נמסרה לסנגור בנט המשפט",
        mail:"ההזמנה נשלחה בדואר רשום למשרד הסנגור"
      };
      var p=[];
      p.push({t:"כבוד השופט, הנאשם לא כאן, וגם הסנגור לא. אני מבקש לשפוט אותו בהעדרו לפי סעיף 240."});
      p.push({t:d[s.delivery]+". סעיף 237(ב) אומר שמסירה לסנגור היא מסירה לנאשם. אם הסנגור לא מצליח להעביר את המסמך, החוק אומר לו מה לעשות: להודיע לבית המשפט תוך חמישה ימים. הוא לא הודיע."});
      if(s.defense) p.push({o:1,t:"ואני מזכיר שהדיון הזה נדחה לבקשת ההגנה עצמה. בית המשפט העליון אישר שפיטה בהעדר בדיוק במצב כזה, בעניין גיש ובעניין אבו גאמע."});
      p.push({t:"מהתביעה לא נדרש להוכיח שהסנגור באמת דיבר עם הנאשם. החוק קבע חזקה, ובית המשפט העליון אמר את זה במפורש בעניין טארק ובעניין אבו גאמע: מסמך שנמסר לסנגור, והסנגור לא הודיע שאינו יכול להעבירו, נחשב כמסמך שהומצא לנאשם."});
      p.push({t:"וסעיף 240 עצמו כבר נתן מענה לנאשם מיוצג: \"זולת אם התייצב סניגור מטעמו\". כלומר, הייצוג מגן על הנאשם רק כשהסנגור מגיע. כאן הוא לא הגיע. ולפי הלכת איטליא, טעות של עורך הדין היא לא סיבה מוצדקת לאי התייצבות."});
      if(s.panel) p.push({o:1,t:"לגבי זה שהתיק עבר שופט: ההזמנה היא לבית המשפט, לא לשופט מסוים. והנאשם בכלל לא הגיע לבניין. אילו היה מגיע, המזכירות הייתה שולחת אותו לאולם הנכון."});
      if(s.fine) p.push({o:1,t:"מדובר בעבירת קנס, בלי שום סיכון למאסר. זה בדיוק המקרה שסעיף 240 נועד לו."});
      if(s.claim) p.push({o:1,t:"ואין לפני בית המשפט שום טענת הגנה. כפירה כללית לא יוצרת עיוות דין, כך נקבע בעניין סאלם."});
      p.push({t:"ואם בכל זאת יתברר שהנאשם באמת לא ידע, החוק נותן לו פתרון: בקשת ביטול לפי סעיף 130(ח), תוך 30 יום, בתצהיר. שם בודקים את הטענה, והנטל עליו. אם נדחה היום על סמך השערה, נהפוך את הנטל, והנאשם שלא בא יקבל יותר ממה שהיה מקבל בבקשת ביטול."});
      if(s.last) p.push({o:1,t:"ובית המשפט כבר נתן בדיון הקודם הזדמנות אחרונה, ואמר זאת במפורש."});
      p.push({t:"לכן אני מבקש להרשיע את הנאשם בהעדרו ולעבור לטיעונים לעונש."});
      if(s.reject) p.push({o:1,t:"אם בית המשפט בכל זאת לא נעתר, אני מבקש שלושה דברים: שבהחלטה ייכתב מהו עיוות הדין הקונקרטי, כפי שנקבע בעניין בדארנה; שהסנגור יודיע תוך שבעה ימים אם עדכן את מרשו; ושייקבע כבר עכשיו שבדיון הבא, אם הנאשם לא יבוא, הוא יישפט בהעדרו."});
      return p;
    },
    cases:[
      {u:N+"5089712", n:"בג\"ץ 2634/20 טארק (עליון, 5.5.20)", d:"פסקה 7: נמסר לסנגור והוא לא הודיע שאינו יכול להעביר, ולכן \"אין מנוס מן הקביעה\" שהומצא כדין."},
      {u:N+"9602306", n:"עפה\"ג 36220-02-25 אבו גאמע (עליון, 6.8.25)", d:"עבירת מהירות, דחייה לבקשת הנאשם, נאשם וסנגור לא התייצבו, קנס 750 ₪ בהעדר. פסקה 19: המצאה לסנגור כמוה כהמצאה לנאשם."},
      {u:N+"4470101", n:"רע\"פ 1911/18 גיש (עליון, 27.5.18)", d:"דיון שנדחה לבקשת ההגנה; נאשם וסנגור לא התייצבו; השפיטה בהעדר אושרה."},
      {u:N+"993314", n:"רע\"פ 9175/09 בן יששכר (עליון), בציטוט הלכת איטליא", d:"טעות משרדית של עורך הדין המייצג אינה סיבה מוצדקת. הנטל לביטול על הנאשם."},
      {u:N+"10183032", n:"עפ\"ת (חיפה) 64563-09-25 זעיר (28.10.25)", d:"אין להניח שהסנגור לא עדכן בלי ראיה; מינוי סנגור אינו פוטר את הנאשם מלעקוב."},
      {u:N+"244439", n:"ר\"ע 418/85 רוקינשטיין (עליון)", d:"ברירת משפט בנויה על דיון בלי נוכחות הנאשם; מי שהוזמן ולא בא, \"אין לו אלא להלין על עצמו\"."},
      {u:N+"5842165", n:"עפ\"ת (חיפה) 17317-07-22 בדארנה (27.7.22)", d:"בית המשפט צריך לנמק את שאלת עיוות הדין לפי סעיף 240(א)(3)."}
    ]
  },
  {
    id:"report",
    tab:"התנגדות לתסקיר משלים",
    subtitle:"התנגדות להפניה נוספת לשירות המבחן לאחר שהתקבל תסקיר שלילי או ללא המלצה טיפולית.",
    groups:[
      {title:"מה עולה מהתסקיר", toggles:[
        {key:"nocoop", label:"לא שיתף פעולה"},
        {key:"denial", label:"שולל נזקקות טיפולית"},
        {key:"twice", label:"נבדק כבר יותר מפעם"},
        {key:"noreq", label:"שירות המבחן לא ביקש דחייה"}]},
      {title:"נסיבות התיק", toggles:[
        {key:"severe", label:"עבירה חמורה (שכרות / פסילה)"},
        {key:"record", label:"עבר תעבורתי מכביד"},
        {key:"long", label:"ההליך נמשך זמן רב"}]},
      {title:"מה ההגנה או השופט טוענים", toggles:[
        {key:"newtreat", label:"\"התחיל טיפול פרטי\""},
        {key:"grant", label:"השופט נוטה להיעתר"}]}
    ],
    defaults:{nocoop:false, denial:true, twice:false, noreq:true, severe:false, record:false, long:false, newtreat:false, grant:false},
    build:function(s){
      var p=[];
      p.push({t:"כבוד השופט, אנחנו מתנגדים להפניה לתסקיר משלים. יש לפני בית המשפט תסקיר מלא, ושירות המבחן לא המליץ בו על טיפול."});
      p.push({t:"לנאשם אין זכות לתסקיר נוסף. זו החלטה שבשיקול דעת בית המשפט בלבד, כך נקבע בעניין חבושה ובעניין יורובסקי. ובית המשפט העליון אמר בעניין עמאר שאין חובה לתסקיר משלים, אפילו כששירות המבחן עצמו מבקש אותו."});
      if(s.noreq) p.push({o:1,t:"וכאן שירות המבחן בכלל לא ביקש דחייה ולא המליץ על המשך מעקב. אז קל וחומר."});
      p.push({t:"והשאלה הפשוטה היא: מה יגיד תסקיר נוסף שלא כתוב כבר בתסקיר הזה? התסקיר מפורט, והוא מדבר בעד עצמו."});
      if(s.nocoop) p.push({o:1,t:"הנאשם לא שיתף פעולה עם שירות המבחן. בעניין חבושה, נאשם שלא הגיע לפגישות ולבדיקות, בית המשפט העליון אמר: \"אין לו אלא להלין על עצמו\". מי שלא ניצל את ההזדמנות הראשונה לא מקבל עוד אחת."});
      if(s.denial) p.push({o:1,t:"הנאשם עצמו אמר לשירות המבחן שהוא לא צריך טיפול. זו לא טעות שתסקיר נוסף יתקן. זו העמדה שלו."});
      if(s.twice) p.push({o:1,t:"הנאשם כבר נבדק יותר מפעם אחת, ואף פעם לא קיבל המלצה טיפולית. זה בדיוק המצב שבו בית המשפט העליון אישר לסרב, בעניין חבושה."});
      if(s.newtreat) p.push({o:1,t:"ולגבי הטענה שהוא התחיל טיפול פרטי: אם יש מסמכים, שיגישו אותם עכשיו. טיפול שמתחיל רק אחרי תסקיר שלילי, רגע לפני גזר הדין, אומר משהו על הדיון, לא על שינוי אמיתי. ההליך הזה הוא לא מקצה שיפורים."});
      p.push({t:"וגם תסקיר חיובי לא מחייב את בית המשפט. שירות המבחן מסתכל על הנאשם, ובית המשפט צריך לשקול גם גמול, הלימה והרתעה. כך נקבע בעניין שווא."});
      if(s.severe) p.push({o:1,t:"ומדובר בעבירה חמורה, שמסכנת חיים בכביש. בעבירות כאלה השיקום לא עומד לבד, וההרתעה מקבלת משקל מרכזי."});
      if(s.record) p.push({o:1,t:"ועברו התעבורתי של הנאשם מכביד. העונשים הקודמים לא הרתיעו אותו."});
      if(s.long) p.push({o:1,t:"וההליך כבר נמשך זמן רב. הפניה נוספת תדחה את גזר הדין בעוד חודשים, ועונש שמגיע מאוחר מאבד מכוחו."});
      p.push({t:"לכן אנחנו מבקשים לדחות את הבקשה ולשמוע טיעונים לעונש היום."});
      if(s.grant) p.push({o:1,t:"אם בית המשפט בכל זאת נוטה להיעתר, אני מבקש שלושה דברים: הפניה קצרה ולשאלה מוגדרת; קביעה שזו ההפניה האחרונה; ושיובהר לנאשם כבר עכשיו שההפניה לא יוצרת ציפייה לעונש מסוים, כפי שנקבע בעניין ימיני."});
      return p;
    },

  ];

  /* ===== מצב ושמירה ===== */
  var store = {active:MODULES[0].id, size:20, data:{}};
  try{ var saved = JSON.parse(localStorage.getItem("court-args") || "null"); if(saved){ store.active=saved.active||store.active; store.size=saved.size||20; store.data=saved.data||{}; } }catch(e){}
  MODULES.forEach(function(m){
    var cur = store.data[m.id] || {};
    var merged = {};
    for(var k in m.defaults){ merged[k] = (k in cur) ? cur[k] : m.defaults[k]; }
    store.data[m.id] = merged;
  });
  var fromHash = location.hash.replace("#","");
  if(MODULES.some(function(m){return m.id===fromHash;})) store.active = fromHash;

  function save(){ try{ localStorage.setItem("court-args", JSON.stringify(store)); }catch(e){} }
  function mod(){ for(var i=0;i<MODULES.length;i++){ if(MODULES[i].id===store.active) return MODULES[i]; } return MODULES[0]; }

  var tabsEl = document.getElementById("tabs");
  MODULES.forEach(function(m){
    var b = document.createElement("button");
    b.className="tab"; b.type="button"; b.id="tab-"+m.id; b.setAttribute("role","tab"); b.textContent=m.tab;
    b.addEventListener("click", function(){ store.active=m.id; try{ history.replaceState(null,"","#"+m.id); }catch(e){} renderAll(); });
    tabsEl.appendChild(b);
  });
  window.addEventListener("hashchange", function(){
    var h = location.hash.replace("#","");
    if(MODULES.some(function(m){return m.id===h;})){ store.active=h; renderAll(); }
  });

  function renderControls(){
    var m = mod(), s = store.data[m.id], box = document.getElementById("controls");
    box.innerHTML = "";
    m.groups.forEach(function(g, gi){
      var wrap = document.createElement("div");
      var h = document.createElement("h2"); h.textContent = g.title; wrap.appendChild(h);
      var chips = document.createElement("div"); chips.className="chips";
      if(g.radio){ chips.setAttribute("role","radiogroup"); }
      (g.options||g.toggles).forEach(function(o){
        var b = document.createElement("button");
        b.className="chip"; b.type="button";
        b.id = m.id+"-"+(g.radio?g.radio+"-"+o.val:o.key);
        b.textContent = o.label;
        var on = g.radio ? s[g.radio]===o.val : !!s[o.key];
        b.setAttribute("aria-pressed", String(on));
        b.addEventListener("click", function(){
          if(g.radio){ s[g.radio]=o.val; } else { s[o.key]=!s[o.key]; }
          renderAll();
        });
        chips.appendChild(b);
      });
      wrap.appendChild(chips);
      box.appendChild(wrap);
    });
  }

  function renderAll(){
    var m = mod();
    document.getElementById("subtitle").textContent = m.subtitle;
    MODULES.forEach(function(x){ document.getElementById("tab-"+x.id).setAttribute("aria-selected", String(x.id===m.id)); });
    renderControls();
    var pb = document.getElementById("paraBtn");
    var paraOn = !!(m.paragraph && store.para);
    pb.hidden = !m.paragraph;
    pb.setAttribute("aria-pressed", String(paraOn));
    pb.textContent = paraOn ? "חזרה לטיעון המלא" : "פסקה לטיעון לעונש";
    if(paraOn){
      document.getElementById("speech").innerHTML = '<p>'+m.paragraph(store.data[m.id])+'</p>';
    } else {
      var p = m.build(store.data[m.id]);
      document.getElementById("speech").innerHTML = p.map(function(x){ return '<p'+(x.o?' class="opt"':'')+'>'+x.t+'</p>'; }).join("");
    }
    document.getElementById("cases").innerHTML = m.cases.map(function(c){
      return '<div class="case">'+(c.u?'<a href="'+c.u+'">'+c.n+'</a>':'<b>'+c.n+'</b>')+'<span>'+c.d+'</span></div>';
    }).join("");
    document.documentElement.style.setProperty("--read-size", store.size+"px");
    save();
  }

  document.getElementById("paraBtn").addEventListener("click", function(){ store.para = !store.para; renderAll(); });
  document.getElementById("bigger").addEventListener("click", function(){ store.size=Math.min(30,store.size+2); renderAll(); });
  document.getElementById("smaller").addEventListener("click", function(){ store.size=Math.max(14,store.size-2); renderAll(); });
  document.getElementById("copy").addEventListener("click", function(){
    var text = document.getElementById("speech").innerText;
    var status = document.getElementById("status");
    try{
      navigator.clipboard.writeText(text).then(function(){ status.textContent="הועתק"; }, function(){ status.textContent="ההעתקה נחסמה; סמן את הטקסט והעתק ידנית"; });
    }catch(e){ status.textContent="ההעתקה נחסמה; סמן את הטקסט והעתק ידנית"; }
    setTimeout(function(){ status.textContent=""; }, 2500);
  });

  renderAll();
})();
</script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(function(){});}</script>
</body>
</html>
